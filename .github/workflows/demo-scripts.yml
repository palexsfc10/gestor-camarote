name: Demo deploy scripts

on:
  pull_request:
    paths:
      - "deploy/demo/**"
      - "Makefile"
      - ".github/workflows/demo-scripts.yml"
  push:
    branches: [main, "chore/**"]
    paths:
      - "deploy/demo/**"
      - "Makefile"
      - ".github/workflows/demo-scripts.yml"

jobs:
  shell-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          set -euo pipefail
          for f in \
            deploy/demo/lib/common.sh \
            deploy/demo/preflight-vps.sh \
            deploy/demo/deploy-vps.sh \
            deploy/demo/smoke-vps.sh \
            deploy/demo/rollback-vps.sh \
            deploy/demo/status-vps.sh \
            deploy/demo/tests/run-security-tests.sh \
            deploy/demo/tests/run-transactional-tests.sh
          do
            bash -n "$f"
            echo "bash -n OK $f"
          done

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -x \
            deploy/demo/lib/common.sh \
            deploy/demo/preflight-vps.sh \
            deploy/demo/deploy-vps.sh \
            deploy/demo/smoke-vps.sh \
            deploy/demo/rollback-vps.sh \
            deploy/demo/status-vps.sh \
            deploy/demo/tests/run-security-tests.sh \
            deploy/demo/tests/run-transactional-tests.sh

      - name: Security unit tests
        run: bash deploy/demo/tests/run-security-tests.sh

      - name: Transactional failure-injection tests
        run: bash deploy/demo/tests/run-transactional-tests.sh

      - name: Dry-run deploy (no Docker daemon required)
        env:
          PEROLA_DEMO_EXPECTED_HOSTNAME: ${{ runner.name }}
        run: |
          # Hostname override for CI runners
          export PEROLA_DEMO_EXPECTED_HOSTNAME="$(hostname -s || hostname)"
          ./deploy/demo/deploy-vps.sh --dry-run --yes 0528b4a5fca641c15468a6c506f8f153f3466da8
